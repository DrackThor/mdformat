# Golden-file integration cases.
#
# Each case formats inputs/<input> and compares the result to expected/<expected>.
# Expected files are written by hand — they state what the formatter should do,
# so they must never be generated by running the formatter.
#
# `config` is optional and takes the same shape as .mdformat.yaml, which lets one
# input have a golden per option value.

cases:
  - input: notes.md
    expected: notes.md

  - input: readme.md
    expected: readme.md

  - input: setext.md
    expected: setext.md

  - input: atx-headings.md
    expected: atx-headings.md

  - input: hard-tabs.md
    expected: hard-tabs.md

  - input: code-fence-style.md
    expected: code-fence-style.md

  - input: code-fence-style.md
    expected: code-fence-style-tilde.md
    config:
      options:
        code-fence-style:
          marker: "~"

  - input: ordered-list-numbering.md
    expected: ordered-list-numbering-increment.md
    config:
      options:
        ordered-list-numbering:
          style: increment

  - input: ordered-list-numbering.md
    expected: ordered-list-numbering-keep.md
    config:
      options:
        ordered-list-numbering:
          style: keep
