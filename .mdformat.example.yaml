# Example mdformat configuration.
#
# Place this file as ./.mdformat.yaml in a project (highest precedence besides
# an explicit --config), or as $XDG_CONFIG_HOME/mdformat/config.yaml for
# user-wide defaults (falls back to ~/.config/mdformat/config.yaml).
#
# The "rules" list defines BOTH which rules run and the order they run in.
# Remove a rule from the list to disable it.

# How much the CLI reports about its own work:
#   0  only the files it changed (default)
#   1  the rules that changed each file
#   2  the lines each rule changed
# The -v/-vv flag overrides this.
verbosity: 0

rules:
  - trailing-whitespace
  - hard-tabs
  - code-fence-style
  - setext-headings
  - atx-headings
  - list-markers
  - ordered-list-numbering
  - semantic-line-breaks
  - table-width
  - blank-lines

options:
  semantic-line-breaks:
    # Where to insert breaks. Default: only at sentence ends.
    # Available: sentence (. ! ?), colon (:), semicolon (;), em-dash (—), comma (,)
    break-on:
      - sentence

  table-width:
    # Pad each cell to the column's widest cell content plus this many spaces.
    padding: 1

  hard-tabs:
    # Tab stop width. A tab expands to the spaces that reach the next stop, so
    # what a tab becomes depends on the column it starts at.
    width: 4

  atx-headings:
    # Trailing punctuation stripped from heading text (markdownlint MD026).
    # Set to "" to keep heading punctuation as written. A mark kept literal by a
    # backslash escape ("## Done\.") is never stripped.
    strip-trailing-punctuation: ".,;:!?"

  code-fence-style:
    # Fence character every fenced code block is rewritten with: "`" or "~".
    # Fences are three characters long unless their content holds a longer run
    # of the marker, which would close the block early.
    marker: "`"

  list-markers:
    # Unordered bullet character to normalize to: "-", "*", or "+".
    marker: "-"

  ordered-list-numbering:
    # How to number ordered list items. The number a list starts at is always
    # kept; only the items after it are rewritten.
    # increment (default) the starting number counts up: 1. 2. 3.
    # keep      leave every marker as written
    style: increment

  blank-lines:
    # Maximum consecutive blank lines allowed between blocks (1 = one blank line).
    max-blank: 1
